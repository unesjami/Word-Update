<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #080c12;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #d9e6f5;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 2rem 2rem 2rem;
      background: #0b111a;
    }

    .top-signature {
      width: 100%;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 350;
      letter-spacing: 1px;
      color: #6585a8;
      margin-bottom: 0.2rem;
    }

    .word-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 0;
    }

    .page {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .page.active-page {
      display: flex;
    }

    .word-flow {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      overflow-y: auto;
      padding: 0.5rem 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: #3d5a7c #131f2c;
      flex: 1;
    }

    @keyframes smartFlow {
      0% { 
        opacity: 0.6; 
        transform: translateX(-8px) translateY(0); 
        border-left: 2px solid #4aa0ff; 
        box-shadow: 0 0 5px rgba(74, 160, 255, 0.2);
      }
      30% { 
        opacity: 1; 
        transform: translateX(3px) translateY(-2px); 
        border-left: 2px solid #7fb9ff; 
        box-shadow: 0 0 15px rgba(127, 185, 255, 0.4);
      }
      60% { 
        transform: translateX(-2px) translateY(2px); 
        border-left: 2px solid #4aa0ff; 
        box-shadow: 0 0 8px rgba(74, 160, 255, 0.3);
      }
      100% { 
        opacity: 1; 
        transform: translateX(0) translateY(0); 
        border-left: 2px solid transparent; 
        box-shadow: none;
      }
    }

    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0.2rem 0.7rem 0.8rem;
      margin: 0.2rem 0;
      border-bottom: 1px solid #1c2b3a;
      transition: all 0.2s ease;
      animation: smartFlow 1.6s ease-out forwards;
    }

    .word-main {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
    }

    .word-pair {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .word-number {
      font-size: 0.65rem;
      color: #4f6e91;
      min-width: 1.8rem;
    }

    .en-word {
      font-weight: 430;
      font-size: 1.1rem;
      color: #e0efff;
    }

    .fa-word {
      font-weight: 350;
      font-size: 1rem;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
      color: #b6d0ec;
    }

    .ai-sentence {
      font-size: 0.7rem;
      color: #9bb9de;
      margin-left: 2.6rem;
      margin-top: 0.1rem;
      font-style: normal;
      letter-spacing: 0.1px;
      max-width: 95%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 1px solid #2f4d70;
      padding-left: 0.5rem;
      background: linear-gradient(90deg, #132433 0%, transparent 100%);
      border-radius: 0 4px 4px 0;
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .icon-group {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #779cc2;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem;
      transition: 0.1s;
      line-height: 1;
    }

    .icon-btn:hover {
      color: #c0deff;
      transform: scale(1.1);
    }

    .delete-btn {
      color: #9f7b8f;
      font-size: 1.2rem;
    }
    .delete-btn:hover {
      color: #ffa7b9;
    }

    /* mastery circle - shows fraction and fills progressively */
    .mastery-circle {
      position: fixed;
      top: 20px;
      right: 25px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #1e3245;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 500;
      color: #d0e2ff;
      box-shadow: 0 0 10px #1f3f5e;
      transition: all 0.3s ease;
      z-index: 100;
      border: 2px solid #3d6380;
    }

    .mastery-circle.filled {
      border-color: #7ae9a7;
      color: white;
      box-shadow: 0 0 20px #55dd88;
    }

    /* fill overlay using conic gradient */
    .mastery-circle .fill-overlay {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: conic-gradient(#55dd88 0deg 0deg, transparent 0deg 360deg);
      mask: radial-gradient(circle at center, transparent 55%, black 56%);
      -webkit-mask: radial-gradient(circle at center, transparent 55%, black 56%);
      transition: background 0.3s ease;
      pointer-events: none;
      z-index: -1;
    }

    .mastery-circle span {
      position: relative;
      z-index: 2;
      line-height: 1.2;
      text-align: center;
    }

    .mastery-circle .fraction {
      font-size: 0.7rem;
      opacity: 0.9;
    }

    .empty-message {
      color: #3d5c7c;
      padding: 2rem 0;
      text-align: center;
      font-size: 0.85rem;
    }

    .input-panel-bottom {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 0.8rem;
      margin-bottom: 0.3rem;
    }

    .small-input {
      background: #1a2635;
      border-radius: 40px;
      padding: 0.3rem 0.3rem 0.3rem 1.5rem;
      border: 1px solid #2f4057;
      display: inline-flex;
      align-items: center;
      width: auto;
      min-width: 300px;
      max-width: 450px;
    }

    #wordInput {
      background: transparent;
      border: none;
      padding: 0.55rem 0.2rem 0.55rem 0;
      font-size: 0.95rem;
      color: #eaf1ff;
      outline: none;
      width: 180px;
      flex: 1;
    }

    #wordInput::placeholder {
      color: #5f7da2;
      font-weight: 300;
      font-size: 0.9rem;
      opacity: 1;
    }

    .lang-mini {
      background: #1f3245;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.65rem;
      color: #b3d1fc;
      display: flex;
      gap: 0.3rem;
      white-space: nowrap;
      border: 1px solid #385375;
    }

    .status-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      min-height: 2rem;
      margin: 0.2rem 0;
    }

    .loading, .error-message {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: #1c2a38;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #b7d6ff;
      border: 1px solid #3b5470;
    }

    .loading.show, .error-message.show {
      display: inline-flex;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #7eb0ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .page-switch {
      display: flex;
      gap: 0.2rem;
      background: #1c2736;
      padding: 0.15rem;
      border-radius: 40px;
      border: 1px solid #2f4157;
      margin-left: 0.5rem;
    }
    .page-btn {
      background: transparent;
      border: none;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #91aecf;
      cursor: pointer;
    }
    .page-btn.active {
      background: #2a405b;
      color: white;
    }

    /* hide extra text */
    .top-signature span, .edit-sync {
      display: none;
    }

    footer, .list-header, .enter-hint, .def-hint, .ai-badge {
      display: none;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-signature">Word Update · mastery</div>

  <!-- Dynamic fraction circle -->
  <div class="mastery-circle" id="masteryCircle">
    <div class="fill-overlay" id="circleFill"></div>
    <span id="circleFraction">0/0</span>
    <span class="fraction">kept</span>
  </div>

  <div class="word-stage">
    <div class="page active-page" id="mainPage">
      <div class="word-flow" id="listInner"></div>
    </div>
    <div class="page" id="keptPage">
      <div class="word-flow" id="keptListInner"></div>
    </div>
  </div>

  <div class="status-line">
    <div class="loading" id="loadingIndicator">
      <div class="spinner"></div><span>...</span>
    </div>
    <div class="error-message" id="errorMessage"></div>
  </div>

  <div class="input-panel-bottom">
    <div class="small-input">
      <input type="text" id="wordInput" placeholder="Add word here" autofocus>
      <div class="lang-mini" id="langDisplay">
        <span id="detectedLang">EN</span>
        <span>→</span>
        <span id="targetLang">FA</span>
      </div>
    </div>
    <div class="page-switch">
      <button class="page-btn active" id="showMainPage">active</button>
      <button class="page-btn" id="showKeptPage">kept</button>
    </div>
  </div>
</div>

<script>
  (function() {
    let wordPairs = [];
    const STORAGE_KEY = 'word_update_fraction_v2';

    const inputEl = document.getElementById('wordInput');
    const mainList = document.getElementById('listInner');
    const keptList = document.getElementById('keptListInner');
    const detectedLangSpan = document.getElementById('detectedLang');
    const targetLangSpan = document.getElementById('targetLang');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const masteryCircle = document.getElementById('masteryCircle');
    const circleFill = document.getElementById('circleFill');
    const circleFraction = document.getElementById('circleFraction');

    const mainPageBtn = document.getElementById('showMainPage');
    const keptPageBtn = document.getElementById('showKeptPage');
    const mainPage = document.getElementById('mainPage');
    const keptPage = document.getElementById('keptPage');

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        wordPairs = JSON.parse(saved);
      } else {
        wordPairs = [
          { en: 'clarity', fa: 'وضوح', kept: false },
          { en: 'presence', fa: 'حضور', kept: false },
        ];
      }
    } catch (e) { wordPairs = []; }

    function smartAISentence(word) {
      if (!word) return 'example sentence missing.';
      const w = word.toLowerCase().trim();
      
      const contextMap = {
        'clarity': 'The clarity of her explanation made everything understandable.',
        'presence': 'His presence alone brought a sense of calm to the room.',
        'example': 'This is a perfect example of how context works.',
        'translation': 'A good translation captures both meaning and tone.',
        'hello': 'Hello is the most common greeting in English.',
        'world': 'The world is full of fascinating places to explore.',
        'peace': 'Peace begins with a smile, she said.',
        'light': 'Light travels faster than sound, which is why we see lightning first.',
        'dark': 'The dark forest seemed mysterious and ancient.',
        'strong': 'Strong winds knocked down several trees.',
        'quick': 'The quick brown fox jumps over the lazy dog.',
        'happy': 'Happy people often spread joy to others.',
        'sad': 'The sad movie made everyone cry.',
        'big': 'A big responsibility comes with great power.',
        'small': 'Small details can make a big difference.',
        'good': 'Good habits lead to a successful life.',
        'bad': 'Bad weather forced the event to cancel.',
        'new': 'A new beginning brings hope and excitement.',
        'old': 'The old house had many stories to tell.',
        'day': 'Each new day is a chance to improve.',
        'night': 'The night sky was filled with stars.',
        'love': 'Love is patient, love is kind.',
        'hate': 'Hate only leads to more suffering.',
        'life': 'Life is what happens when you are busy making plans.',
        'time': 'Time waits for no one.',
        'person': 'She is the kindest person I have ever met.',
        'place': 'This place feels like home.',
        'thing': 'The most important thing is to stay curious.',
        'way': 'There is always a way forward.',
        'look': 'Look before you leap, they say.',
        'make': 'Make each day your masterpiece.',
        'use': 'Use your time wisely.',
        'find': 'You will find what you are looking for.',
        'give': 'Give without expecting anything back.',
        'tell': 'Tell me a story.',
        'work': 'Hard work pays off in the end.',
        'call': 'Call me when you arrive safely.',
        'try': 'Try and try until you succeed.',
        'ask': 'Ask and you shall receive.',
        'need': 'All you need is love.',
        'feel': 'I feel happy today.',
        'become': 'She wants to become a doctor.',
        'leave': 'Leave no trace behind.',
        'put': 'Put your thoughts into words.'
      };

      if (contextMap[w]) return contextMap[w];
      
      const templates = [
        `"${word}" is frequently used in everyday English conversations.`,
        `Learning "${word}" helps you express yourself better.`,
        `The word "${word}" appears often in news articles.`,
        `"${word}" can be used in both formal and informal contexts.`,
        `Try using "${word}" three times today to remember it.`,
        `"${word}" has a rich history in the English language.`,
        `Many learners find "${word}" useful for daily communication.`,
        `Understanding "${word}" will improve your fluency.`,
        `"${word}" is a versatile word with many applications.`,
        `Practice saying "${word}" out loud to master it.`
      ];
      
      return templates[Math.floor(Math.random() * templates.length)];
    }

    wordPairs = wordPairs.map(w => {
      return {
        ...w,
        kept: w.kept === true,
        sentence: w.sentence || smartAISentence(w.en)
      };
    });

    // New function to update the fraction circle
    function updateMasteryCircle() {
      const totalActive = wordPairs.length; // all words count (active+kept) because we count all words in learning journey
      const keptCount = wordPairs.filter(w => w.kept).length;
      
      circleFraction.textContent = `${keptCount}/${totalActive}`;
      
      if (totalActive > 0) {
        const fillPercent = (keptCount / totalActive) * 360;
        circleFill.style.background = `conic-gradient(#55dd88 0deg ${fillPercent}deg, transparent ${fillPercent}deg 360deg)`;
      } else {
        circleFill.style.background = `conic-gradient(transparent 0deg 360deg)`;
      }

      if (keptCount > 0 && keptCount === totalActive) {
        masteryCircle.classList.add('filled');
      } else {
        masteryCircle.classList.remove('filled');
      }
    }

    function isPersian(text) {
      if (!text.trim()) return false;
      return /[\u0600-\u06FF\u0750-\u077F]/.test(text);
    }

    function updateLangHint() {
      const raw = inputEl.value;
      if (!raw.trim()) {
        detectedLangSpan.textContent = 'EN';
        targetLangSpan.textContent = 'FA';
        return;
      }
      const persian = isPersian(raw);
      detectedLangSpan.textContent = persian ? 'FA' : 'EN';
      targetLangSpan.textContent = persian ? 'EN' : 'FA';
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 2000);
    }

    async function translateWithAPI(text, source, target) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.responseStatus === 200 && data.responseData?.translatedText) {
        return data.responseData.translatedText;
      }
      throw new Error('translation failed');
    }

    async function addFromInput() {
      const raw = inputEl.value.trim();
      if (!raw) return;

      loadingIndicator.classList.add('show');
      inputEl.disabled = true;

      try {
        const persian = isPersian(raw);
        let enWord, faWord;

        if (persian) {
          const translation = await translateWithAPI(raw, 'fa', 'en');
          faWord = raw;
          enWord = translation;
        } else {
          const translation = await translateWithAPI(raw, 'en', 'fa');
          enWord = raw;
          faWord = translation;
        }

        const sentence = smartAISentence(enWord);
        wordPairs.push({ en: enWord, fa: faWord, kept: false, sentence });
        persistAndRender();
        inputEl.value = '';
        updateLangHint();
      } catch (err) {
        showError(err.message);
      } finally {
        loadingIndicator.classList.remove('show');
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    async function editWord(index) {
      const word = wordPairs[index];
      if (!word) return;
      const newEn = prompt('Edit English word / sentence:', word.en);
      if (!newEn || newEn.trim() === '' || newEn === word.en) return;

      loadingIndicator.classList.add('show');
      inputEl.disabled = true;

      try {
        const text = newEn.trim();
        const persian = isPersian(text);
        let newEnWord, newFaWord;

        if (persian) {
          const translation = await translateWithAPI(text, 'fa', 'en');
          newEnWord = translation;
          newFaWord = text;
        } else {
          const translation = await translateWithAPI(text, 'en', 'fa');
          newEnWord = text;
          newFaWord = translation;
        }

        wordPairs[index].en = newEnWord;
        wordPairs[index].fa = newFaWord;
        wordPairs[index].sentence = smartAISentence(newEnWord);
        persistAndRender();
      } catch (err) {
        showError('translation failed, word not updated');
      } finally {
        loadingIndicator.classList.remove('show');
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    function toggleKept(index) {
      if (index >= 0 && index < wordPairs.length) {
        wordPairs[index].kept = !wordPairs[index].kept;
        persistAndRender();
      }
    }

    function deleteWord(index) {
      if (index >= 0 && index < wordPairs.length) {
        wordPairs.splice(index, 1);
        persistAndRender();
      }
    }

    function speakEnglish(text) {
      if (!window.speechSynthesis) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>]/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderAll() {
      const active = wordPairs.filter(w => !w.kept);
      const kept = wordPairs.filter(w => w.kept);

      if (active.length === 0) {
        mainList.innerHTML = `<div class="empty-message">no active words</div>`;
      } else {
        let html = '';
        active.forEach((pair, idx) => {
          const globalIdx = wordPairs.findIndex(w => w.en === pair.en && w.fa === pair.fa);
          html += renderItem(pair, idx+1, globalIdx, false);
        });
        mainList.innerHTML = html;
      }

      if (kept.length === 0) {
        keptList.innerHTML = `<div class="empty-message">no kept words</div>`;
      } else {
        let keptHtml = '';
        kept.forEach((pair, idx) => {
          const globalIdx = wordPairs.findIndex(w => w.en === pair.en && w.fa === pair.fa);
          keptHtml += renderItem(pair, idx+1, globalIdx, true);
        });
        keptList.innerHTML = keptHtml;
      }

      attachEvents();
      updateMasteryCircle(); // update circle after every render
    }

    function renderItem(pair, number, globalIdx, isKeptPage) {
      const enEsc = escapeHtml(pair.en);
      const faEsc = escapeHtml(pair.fa);
      const sentenceEsc = escapeHtml(pair.sentence || smartAISentence(pair.en));
      const tickBtn = isKeptPage ? '' : `<button class="icon-btn" data-global-index="${globalIdx}" data-action="tick" title="keep">✔</button>`;
      return `
        <div class="word-item" data-global-index="${globalIdx}">
          <div class="word-main">
            <div class="word-pair">
              <span class="word-number">#${number}</span>
              <span class="en-word">${enEsc}</span>
              <span class="fa-word">${faEsc}</span>
            </div>
            <div class="ai-sentence">💡 ${sentenceEsc}</div>
          </div>
          <div class="right-group">
            <div class="icon-group">
              <button class="icon-btn" data-global-index="${globalIdx}" data-action="edit">✎</button>
              <button class="icon-btn" data-global-index="${globalIdx}" data-action="voice">🔊</button>
              ${tickBtn}
              <button class="icon-btn delete-btn" data-global-index="${globalIdx}" data-action="delete">✕</button>
            </div>
          </div>
        </div>
      `;
    }

    function attachEvents() {
      document.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null) editWord(parseInt(idx));
        });
      });
      document.querySelectorAll('[data-action="voice"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null && wordPairs[idx]) speakEnglish(wordPairs[idx].en);
        });
      });
      document.querySelectorAll('[data-action="tick"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null) toggleKept(parseInt(idx));
        });
      });
      document.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null) deleteWord(parseInt(idx));
        });
      });
    }

    function persistAndRender() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(wordPairs)); } catch (e) {}
      renderAll();
    }

    mainPageBtn.addEventListener('click', () => {
      mainPage.classList.add('active-page');
      keptPage.classList.remove('active-page');
      mainPageBtn.classList.add('active');
      keptPageBtn.classList.remove('active');
    });
    keptPageBtn.addEventListener('click', () => {
      keptPage.classList.add('active-page');
      mainPage.classList.remove('active-page');
      keptPageBtn.classList.add('active');
      mainPageBtn.classList.remove('active');
    });

    inputEl.addEventListener('input', updateLangHint);
    inputEl.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        await addFromInput();
      }
    });

    renderAll();
    updateLangHint();
  })();
</script>
</body>
</html>
