<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://i.ibb.co/GQX4pNkL/logo1.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Update · edit fixes translation</title>
  <!-- Vazirmatn for Persian -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    /* full 16:9 minimal dark canvas */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #080c12;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #d9e6f5;
    }

    /* main full-screen container — 16:9 friendly, no frames */
    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 2rem 2rem 2rem;
      background: #0b111a;
    }

    .top-signature {
      width: 100%;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 350;
      letter-spacing: 1px;
      color: #6585a8;
      margin-bottom: 0.2rem;
    }

    .word-stage {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 0;
    }

    .page {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .page.active-page {
      display: flex;
    }

    .word-flow {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      overflow-y: auto;
      padding: 0.5rem 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: #3d5a7c #131f2c;
      flex: 1;
    }

    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.2rem 0.5rem 0.8rem;
      margin: 0.2rem 0;
      border-bottom: 1px solid #1c2b3a;
    }

    .word-main {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .word-number {
      font-size: 0.65rem;
      color: #4f6e91;
      min-width: 1.8rem;
    }

    .en-word {
      font-weight: 430;
      font-size: 1.1rem;
      color: #e0efff;
    }

    .fa-word {
      font-weight: 350;
      font-size: 1rem;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
      color: #b6d0ec;
    }

    .icon-group {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #779cc2;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem;
      transition: 0.1s;
      line-height: 1;
    }

    .icon-btn:hover {
      color: #c0deff;
      transform: scale(1.1);
    }

    .delete-btn {
      color: #9f7b8f;
      font-size: 1.2rem;
    }
    .delete-btn:hover {
      color: #ffa7b9;
    }

    .empty-message {
      color: #3d5c7c;
      padding: 2rem 0;
      text-align: center;
      font-size: 0.85rem;
    }

    .input-panel-bottom {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 0.8rem;
      margin-bottom: 0.3rem;
    }

    .small-input {
      background: #1a2635;
      border-radius: 40px;
      padding: 0.3rem 0.3rem 0.3rem 1.5rem;
      border: 1px solid #2f4057;
      display: inline-flex;
      align-items: center;
      width: auto;
      min-width: 300px;
      max-width: 450px;
    }

    #wordInput {
      background: transparent;
      border: none;
      padding: 0.55rem 0.2rem 0.55rem 0;
      font-size: 0.95rem;
      color: #eaf1ff;
      outline: none;
      width: 180px;
      flex: 1;
    }

    #wordInput::placeholder {
      color: #4b6a8a;
      font-weight: 300;
      font-size: 0.8rem;
    }

    .lang-mini {
      background: #1f3245;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.65rem;
      color: #b3d1fc;
      display: flex;
      gap: 0.3rem;
      white-space: nowrap;
      border: 1px solid #385375;
    }

    .status-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      min-height: 2rem;
      margin: 0.2rem 0;
    }

    .loading, .error-message {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: #1c2a38;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #b7d6ff;
      border: 1px solid #3b5470;
    }

    .loading.show, .error-message.show {
      display: inline-flex;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #7eb0ff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .page-switch {
      display: flex;
      gap: 0.2rem;
      background: #1c2736;
      padding: 0.15rem;
      border-radius: 40px;
      border: 1px solid #2f4157;
      margin-left: 0.5rem;
    }
    .page-btn {
      background: transparent;
      border: none;
      padding: 0.2rem 1.2rem;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #91aecf;
      cursor: pointer;
    }
    .page-btn.active {
      background: #2a405b;
      color: white;
    }

    /* hide all extra sentences */
    footer, .list-header, .enter-hint, .def-hint, .ai-badge {
      display: none;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="top-signature">Word Update · edit syncs translation</div>

  <div class="word-stage">
    <div class="page active-page" id="mainPage">
      <div class="word-flow" id="listInner"></div>
    </div>
    <div class="page" id="keptPage">
      <div class="word-flow" id="keptListInner"></div>
    </div>
  </div>

  <div class="status-line">
    <div class="loading" id="loadingIndicator">
      <div class="spinner"></div><span>...</span>
    </div>
    <div class="error-message" id="errorMessage"></div>
  </div>

  <div class="input-panel-bottom">
    <div class="small-input">
      <input type="text" id="wordInput" placeholder="word (en/fa)" autofocus>
      <div class="lang-mini" id="langDisplay">
        <span id="detectedLang">EN</span>
        <span>→</span>
        <span id="targetLang">FA</span>
      </div>
    </div>
    <div class="page-switch">
      <button class="page-btn active" id="showMainPage">active</button>
      <button class="page-btn" id="showKeptPage">kept</button>
    </div>
  </div>
</div>

<script>
  (function() {
    let wordPairs = [];
    const STORAGE_KEY = 'word_update_fix_v2';

    const inputEl = document.getElementById('wordInput');
    const mainList = document.getElementById('listInner');
    const keptList = document.getElementById('keptListInner');
    const detectedLangSpan = document.getElementById('detectedLang');
    const targetLangSpan = document.getElementById('targetLang');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');

    const mainPageBtn = document.getElementById('showMainPage');
    const keptPageBtn = document.getElementById('showKeptPage');
    const mainPage = document.getElementById('mainPage');
    const keptPage = document.getElementById('keptPage');

    // load or seed
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        wordPairs = JSON.parse(saved);
      } else {
        wordPairs = [
          { en: 'clarity', fa: 'وضوح', kept: false },
          { en: 'presence', fa: 'حضور', kept: false },
        ];
      }
    } catch (e) { wordPairs = []; }

    wordPairs = wordPairs.map(w => ({ ...w, kept: w.kept === true }));

    function isPersian(text) {
      if (!text.trim()) return false;
      return /[\u0600-\u06FF\u0750-\u077F]/.test(text);
    }

    function updateLangHint() {
      const raw = inputEl.value;
      if (!raw.trim()) {
        detectedLangSpan.textContent = 'EN';
        targetLangSpan.textContent = 'FA';
        return;
      }
      const persian = isPersian(raw);
      detectedLangSpan.textContent = persian ? 'FA' : 'EN';
      targetLangSpan.textContent = persian ? 'EN' : 'FA';
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 2000);
    }

    async function translateWithAPI(text, source, target) {
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.responseStatus === 200 && data.responseData?.translatedText) {
        return data.responseData.translatedText;
      }
      throw new Error('translation failed');
    }

    async function addFromInput() {
      const raw = inputEl.value.trim();
      if (!raw) return;

      loadingIndicator.classList.add('show');
      inputEl.disabled = true;

      try {
        const persian = isPersian(raw);
        let enWord, faWord;

        if (persian) {
          const translation = await translateWithAPI(raw, 'fa', 'en');
          faWord = raw;
          enWord = translation;
        } else {
          const translation = await translateWithAPI(raw, 'en', 'fa');
          enWord = raw;
          faWord = translation;
        }

        wordPairs.push({ en: enWord, fa: faWord, kept: false });
        persistAndRender();
        inputEl.value = '';
        updateLangHint();
      } catch (err) {
        showError(err.message);
      } finally {
        loadingIndicator.classList.remove('show');
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    // --- EDITED: editWord now fetches new translation based on new english text ---
    async function editWord(index) {
      const word = wordPairs[index];
      if (!word) return;
      const newEn = prompt('Edit English word / sentence:', word.en);
      if (!newEn || newEn.trim() === '' || newEn === word.en) return;

      loadingIndicator.classList.add('show');
      inputEl.disabled = true;  // block input during translation

      try {
        // detect if new text is persian? but we are editing english field, so assume english.
        // However to be safe: if user enters persian in prompt, we handle.
        const text = newEn.trim();
        const persian = isPersian(text);
        let newEnWord, newFaWord;

        if (persian) {
          // user wrote persian in english field? we treat as persian source
          const translation = await translateWithAPI(text, 'fa', 'en');
          newEnWord = translation;   // translated to english
          newFaWord = text;
        } else {
          // english source -> translate to persian
          const translation = await translateWithAPI(text, 'en', 'fa');
          newEnWord = text;
          newFaWord = translation;
        }

        // update the word pair
        wordPairs[index].en = newEnWord;
        wordPairs[index].fa = newFaWord;
        persistAndRender();
      } catch (err) {
        showError('translation failed, word not updated');
      } finally {
        loadingIndicator.classList.remove('show');
        inputEl.disabled = false;
        inputEl.focus();
      }
    }

    function toggleKept(index) {
      if (index >= 0 && index < wordPairs.length) {
        wordPairs[index].kept = !wordPairs[index].kept;
        persistAndRender();
      }
    }

    function deleteWord(index) {
      if (index >= 0 && index < wordPairs.length) {
        wordPairs.splice(index, 1);
        persistAndRender();
      }
    }

    function speakEnglish(text) {
      if (!window.speechSynthesis) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>]/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    function renderAll() {
      const active = wordPairs.filter(w => !w.kept);
      const kept = wordPairs.filter(w => w.kept);

      if (active.length === 0) {
        mainList.innerHTML = `<div class="empty-message">no active words</div>`;
      } else {
        let html = '';
        active.forEach((pair, idx) => {
          const globalIdx = wordPairs.findIndex(w => w.en === pair.en && w.fa === pair.fa);
          html += renderItem(pair, idx+1, globalIdx, false);
        });
        mainList.innerHTML = html;
      }

      if (kept.length === 0) {
        keptList.innerHTML = `<div class="empty-message">no kept words</div>`;
      } else {
        let keptHtml = '';
        kept.forEach((pair, idx) => {
          const globalIdx = wordPairs.findIndex(w => w.en === pair.en && w.fa === pair.fa);
          keptHtml += renderItem(pair, idx+1, globalIdx, true);
        });
        keptList.innerHTML = keptHtml;
      }

      attachEvents();
    }

    function renderItem(pair, number, globalIdx, isKeptPage) {
      const enEsc = escapeHtml(pair.en);
      const faEsc = escapeHtml(pair.fa);
      const tickBtn = isKeptPage ? '' : `<button class="icon-btn" data-global-index="${globalIdx}" data-action="tick" title="keep">✔</button>`;
      return `
        <div class="word-item">
          <div class="word-main">
            <span class="word-number">#${number}</span>
            <span class="en-word">${enEsc}</span>
            <span class="fa-word">${faEsc}</span>
          </div>
          <div class="icon-group">
            <button class="icon-btn" data-global-index="${globalIdx}" data-action="edit">✎</button>
            <button class="icon-btn" data-global-index="${globalIdx}" data-action="voice">🔊</button>
            ${tickBtn}
            <button class="icon-btn delete-btn" data-global-index="${globalIdx}" data-action="delete">✕</button>
          </div>
        </div>
      `;
    }

    function attachEvents() {
      document.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null) editWord(parseInt(idx));
        });
      });
      document.querySelectorAll('[data-action="voice"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null && wordPairs[idx]) speakEnglish(wordPairs[idx].en);
        });
      });
      document.querySelectorAll('[data-action="tick"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null) toggleKept(parseInt(idx));
        });
      });
      document.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = btn.getAttribute('data-global-index');
          if (idx !== null) deleteWord(parseInt(idx));
        });
      });
    }

    function persistAndRender() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(wordPairs)); } catch (e) {}
      renderAll();
    }

    // page switching
    mainPageBtn.addEventListener('click', () => {
      mainPage.classList.add('active-page');
      keptPage.classList.remove('active-page');
      mainPageBtn.classList.add('active');
      keptPageBtn.classList.remove('active');
    });
    keptPageBtn.addEventListener('click', () => {
      keptPage.classList.add('active-page');
      mainPage.classList.remove('active-page');
      keptPageBtn.classList.add('active');
      mainPageBtn.classList.remove('active');
    });

    inputEl.addEventListener('input', updateLangHint);
    inputEl.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        await addFromInput();
      }
    });

    renderAll();
    updateLangHint();
  })();
</script>
</body>
</html>
