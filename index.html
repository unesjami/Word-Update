<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://i.ibb.co/fV2yPb2y/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordFlow — English ⇄ Persian Vocabulary Trainer</title>
  <meta name="description" content="A simple bilingual vocabulary trainer for English and Persian — type or speak a word, get an instant translation, and memorize it with flashcards.">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAFAF8;
      --ink: #1E1E1C;
      --ink-soft: #6b675e;
      --ink-faint: #a19d92;
      --accent: #146464;
      --accent-soft: #E9F1EF;
      --gold: #b9860f;
      --border: #E7E4DC;
      --card-bg: #FFFFFF;
      --danger: #a63b34;
    }
    body.dark-mode {
      --bg: #14181A;
      --ink: #ECE9E1;
      --ink-soft: #9CA0A0;
      --ink-faint: #5c6260;
      --accent: #4FD1C0;
      --accent-soft: #1C2626;
      --gold: #E0B84B;
      --border: #262B2C;
      --card-bg: #1A1F21;
      --danger: #e18178;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background 0.2s ease, color 0.2s ease;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    .shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 1.25rem;
    }

    /* ---------- header ---------- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 0 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.9rem;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-mark {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
      flex-shrink: 0;
    }
    .brand-text h1 { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; line-height: 1.1; }
    .brand-text p { font-size: 0.68rem; color: var(--ink-faint); margin-top: 0.15rem; }

    .dark-toggle {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 1rem;
    }
    .dark-toggle:hover { border-color: var(--accent); }

    /* ---------- mode row ---------- */
    .mode-row {
      display: flex;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .segmented {
      display: flex;
      gap: 0.15rem;
      background: var(--card-bg);
      padding: 0.2rem;
      border-radius: 30px;
      border: 1px solid var(--border);
    }
    .seg-btn {
      background: transparent;
      border: none;
      padding: 0.4rem 1.1rem;
      border-radius: 30px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.active { background: var(--accent); color: var(--bg); }

    /* ---------- stage ---------- */
    .word-stage { flex: 1; width: 100%; display: flex; flex-direction: column; min-height: 0; }
    .page { display: none; width: 100%; height: 100%; flex-direction: column; }
    .page.active-page { display: flex; }

    .word-flow {
      width: 100%;
      overflow-y: auto;
      padding: 0.1rem 0.05rem 1rem 0.05rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.75rem 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border 0.15s;
    }
    .word-item:hover { border-color: var(--accent); }

    @keyframes wordPop { 0% { opacity: 0.4; } 100% { opacity: 1; } }
    .word-highlight { animation: wordPop 0.3s ease-out; }

    .word-main { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 0; }
    .en-word { font-weight: 500; font-size: 0.98rem; color: var(--ink); word-break: break-word; }
    .fa-word {
      font-weight: 400; font-size: 0.93rem;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
      color: var(--ink-soft);
      word-break: break-word;
      line-height: 1.6;
    }
    .text-sm { font-size: 0.83rem !important; }

    .empty-message {
      color: var(--ink-faint);
      padding: 2.5rem 1rem;
      text-align: center;
      font-size: 0.85rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .icon-group { display: flex; gap: 0.1rem; align-items: center; flex-shrink: 0; }
    .icon-btn {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 7px;
      font-size: 14px;
      color: var(--ink-soft);
      cursor: pointer;
      background: transparent;
      border: none;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .delete-btn { color: var(--danger); }
    .delete-btn:hover { background: rgba(166,59,52,0.1); color: var(--danger); }

    /* ---------- flashcard mode ---------- */
    .card-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 0;
    }
    .progress-text { font-size: 0.72rem; color: var(--ink-faint); font-weight: 600; }

    .flip-card {
      width: 100%;
      max-width: 380px;
      height: 220px;
      perspective: 1200px;
      cursor: pointer;
    }
    .flip-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      gap: 0.5rem;
    }
    .flip-face-back { transform: rotateY(180deg); }
    .flip-word { font-size: 1.3rem; font-weight: 600; word-break: break-word; }
    .flip-face-back .flip-word { direction: rtl; font-family: 'Vazirmatn', sans-serif; }
    .flip-hint { font-size: 0.65rem; color: var(--ink-faint); }

    .card-controls { display: flex; align-items: center; gap: 0.5rem; }
    .card-controls .icon-btn { width: 34px; height: 34px; font-size: 16px; background: var(--card-bg); border: 1px solid var(--border); }
    .nav-btn { font-weight: 700; }

    /* ---------- status line ---------- */
    .status-line { display: flex; justify-content: center; align-items: center; gap: 0.6rem; min-height: 1.8rem; margin: 0.3rem 0; }
    .loading, .error-message, .toast {
      display: none; align-items: center; gap: 0.4rem;
      background: var(--accent-soft);
      padding: 0.22rem 0.9rem;
      border-radius: 30px;
      font-size: 0.68rem;
      color: var(--accent);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .error-message { background: rgba(166,59,52,0.08); color: var(--danger); }
    .loading.show, .error-message.show, .toast.show { display: inline-flex; }

    .spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- bottom input bar ---------- */
    .input-panel-bottom {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.5rem 0 1.2rem 0;
    }
    .small-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0.25rem 0.25rem 0.25rem 1.1rem;
      display: inline-flex;
      align-items: center;
      flex: 1;
      min-width: 220px;
      max-width: 420px;
      transition: border 0.15s;
    }
    .small-input:focus-within { border-color: var(--accent); }
    #wordInput {
      background: transparent;
      border: none;
      padding: 0.5rem 0.2rem;
      font-size: 0.92rem;
      color: var(--ink);
      outline: none;
      width: 140px;
      flex: 1;
      font-family: 'Inter', sans-serif;
    }
    #wordInput::placeholder { color: var(--ink-faint); font-size: 0.8rem; }

    .mic-btn { color: var(--ink-soft); }
    .mic-btn.listening { color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .mic-lang {
      display: flex; gap: 0.1rem;
      background: var(--accent-soft);
      border-radius: 20px;
      padding: 0.1rem;
      margin-right: 0.2rem;
    }
    .mic-lang button {
      border: none; background: transparent;
      font-size: 0.6rem; font-weight: 700;
      padding: 0.2rem 0.45rem;
      border-radius: 20px;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .mic-lang button.active { background: var(--accent); color: var(--bg); }

    .translate-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 40px;
      padding: 0.6rem 1.1rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .translate-btn:hover { background: var(--accent-strong, var(--accent)); opacity: 0.9; }
    .translate-btn:disabled { opacity: 0.5; cursor: default; }

    footer.site-footer {
      text-align: center;
      font-size: 0.68rem;
      color: var(--ink-faint);
      padding-bottom: 1rem;
    }

    @media (max-width: 560px) {
      .input-panel-bottom { flex-direction: column; align-items: stretch; }
      .small-input, .translate-btn { max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
    button:focus-visible, input:focus-visible, .icon-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
<div class="shell">

  <header class="site-header">
    <div class="brand">
      <div class="brand-mark">W</div>
      <div class="brand-text">
        <h1>WordFlow</h1>
        <p>English ⇄ Persian vocabulary trainer</p>
      </div>
    </div>
    <div class="dark-toggle" id="darkModeToggle" title="Toggle dark mode" role="button" aria-label="Toggle dark mode">🌙</div>
  </header>

  <div class="mode-row">
    <div class="segmented" id="pageSwitch">
      <button class="seg-btn active" data-page="mainPage">Active</button>
      <button class="seg-btn" data-page="keptPage">Kept</button>
      <button class="seg-btn" data-page="cardsPage">Cards</button>
    </div>
  </div>

  <main class="word-stage">
    <div class="page active-page" id="mainPage">
      <div class="word-flow" id="listInner"></div>
    </div>
    <div class="page" id="keptPage">
      <div class="word-flow" id="keptListInner"></div>
    </div>
    <div class="page" id="cardsPage">
      <div class="card-stage" id="cardStage">
        <div class="progress-text" id="cardProgress">0 / 0</div>
        <div class="flip-card" id="flipCard">
          <div class="flip-card-inner">
            <div class="flip-face flip-face-front">
              <div class="flip-word" id="flipFront">—</div>
              <div class="flip-hint">tap to reveal</div>
            </div>
            <div class="flip-face flip-face-back">
              <div class="flip-word" id="flipBack">—</div>
              <div class="flip-hint">tap to hide</div>
            </div>
          </div>
        </div>
        <div class="card-controls">
          <button class="icon-btn nav-btn" id="cardPrev" title="previous">‹</button>
          <button class="icon-btn" id="cardSpeak" title="listen">🔊</button>
          <button class="icon-btn" id="cardKeep" title="keep">✔</button>
          <button class="icon-btn nav-btn" id="cardNext" title="next">›</button>
        </div>
      </div>
    </div>
  </main>

  <div class="status-line">
    <div class="loading" id="loadingIndicator"><div class="spinner"></div><span>translating…</span></div>
    <div class="error-message" id="errorMessage"></div>
    <div class="toast" id="toastMessage"></div>
  </div>

  <div class="input-panel-bottom">
    <div class="small-input">
      <div class="mic-lang" id="micLang">
        <button data-lang="en-US" class="active" title="Voice input in English">EN</button>
        <button data-lang="fa-IR" title="Voice input in Persian">FA</button>
      </div>
      <button class="icon-btn mic-btn" id="micBtn" title="Speak a word">🎤</button>
      <input type="text" id="wordInput" placeholder="Type or speak a word — EN or FA" autofocus>
    </div>
    <button class="translate-btn" id="translateBtn">Translate ↵</button>
  </div>

  <footer class="site-footer">WordFlow · built by Unes Jami</footer>
</div>

<script>
  (function() {
    let wordPairs = [];
    let cardIndex = 0;
    let cardFlipped = false;
    const STORAGE_KEY = 'word_update_fix_v6';

    const inputEl = document.getElementById('wordInput');
    const mainList = document.getElementById('listInner');
    const keptList = document.getElementById('keptListInner');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMessage = document.getElementById('errorMessage');
    const toastMessage = document.getElementById('toastMessage');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const translateBtn = document.getElementById('translateBtn');
    const micBtn = document.getElementById('micBtn');
    const micLang = document.getElementById('micLang');

    const pageSwitch = document.getElementById('pageSwitch');
    const pages = {
      mainPage: document.getElementById('mainPage'),
      keptPage: document.getElementById('keptPage'),
      cardsPage: document.getElementById('cardsPage'),
    };

    // ---------- dark mode ----------
    let isDark = localStorage.getItem('wordapp_dark') === 'true';
    function applyDarkMode() {
      document.body.classList.toggle('dark-mode', isDark);
      darkModeToggle.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('wordapp_dark', isDark);
    }
    applyDarkMode();
    darkModeToggle.addEventListener('click', () => { isDark = !isDark; applyDarkMode(); });

    // ---------- load ----------
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      wordPairs = saved ? JSON.parse(saved) : [];
    } catch (e) { wordPairs = []; }
    wordPairs = wordPairs.map(w => ({ ...w, kept: w.kept === true }));

    function isPersian(text) {
      if (!text || !text.trim()) return false;
      const persianChars = (text.match(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]/g) || []);
      const totalChars = text.replace(/\s/g, '').length;
      if (totalChars === 0) return false;
      return (persianChars.length / totalChars) > 0.3;
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('show');
      setTimeout(() => errorMessage.classList.remove('show'), 3000);
    }
    function showToast(msg) {
      toastMessage.textContent = msg;
      toastMessage.classList.add('show');
      setTimeout(() => toastMessage.classList.remove('show'), 1500);
    }

    function setHighlight(index) {
      const items = document.querySelectorAll('.word-item');
      if (items[index]) {
        items[index].classList.add('word-highlight');
        setTimeout(() => items[index].classList.remove('word-highlight'), 350);
      }
    }

    async function translateWithAPI(text, source, target) {
      const cleanText = text.trim().replace(/\s+/g, ' ');
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(cleanText)}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data[0]) {
          let fullTranslation = '';
          for (let i = 0; i < data[0].length; i++) {
            if (data[0][i] && data[0][i][0]) fullTranslation += data[0][i][0];
          }
          if (fullTranslation) return fullTranslation;
        }
      } catch (e) { console.log('Google Translate failed, trying backup...', e); }

      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=${source}|${target}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.responseStatus === 200 && data.responseData?.translatedText) return data.responseData.translatedText;
      } catch (e) { console.log('MyMemory failed'); }

      try {
        const url = `https://lingva.ml/api/v1/${source}/${target}/${encodeURIComponent(cleanText)}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data.translation) return data.translation;
      } catch (e) { console.log('Lingva failed'); }

      throw new Error('All translation services failed');
    }

    async function addFromInput() {
      const raw = inputEl.value.trim();
      if (!raw) return;

      loadingIndicator.classList.add('show');
      inputEl.disabled = true;
      translateBtn.disabled = true;

      try {
        const persian = isPersian(raw);
        let enWord, faWord;
        if (persian) {
          faWord = raw;
          enWord = await translateWithAPI(raw, 'fa', 'en');
        } else {
          enWord = raw;
          faWord = await translateWithAPI(raw, 'en', 'fa');
        }
        wordPairs.push({ en: enWord, fa: faWord, kept: false, timestamp: Date.now() });
        persistAndRender();
        inputEl.value = '';
        setHighlight(wordPairs.length - 1);
      } catch (err) {
        showError('Translation failed. Check your connection and try again.');
      } finally {
        loadingIndicator.classList.remove('show');
        inputEl.disabled = false;
        translateBtn.disabled = false;
        inputEl.focus();
      }
    }

    async function editWord(index) {
      const word = wordPairs[index];
      if (!word) return;
      const newText = prompt('Edit text (can be word, sentence, or paragraph):', word.en);
      if (!newText || newText.trim() === '' || newText === word.en) return;

      loadingIndicator.classList.add('show');
      try {
        const text = newText.trim();
        const persian = isPersian(text);
        if (persian) {
          wordPairs[index].en = await translateWithAPI(text, 'fa', 'en');
          wordPairs[index].fa = text;
        } else {
          wordPairs[index].en = text;
          wordPairs[index].fa = await translateWithAPI(text, 'en', 'fa');
        }
        wordPairs[index].timestamp = Date.now();
        persistAndRender();
        setHighlight(index);
      } catch (err) {
        showError('Translation failed. Please try again.');
      } finally {
        loadingIndicator.classList.remove('show');
      }
    }

    function toggleKept(index) {
      if (index >= 0 && index < wordPairs.length) {
        wordPairs[index].kept = !wordPairs[index].kept;
        persistAndRender();
      }
    }

    function deleteWord(index) {
      if (index >= 0 && index < wordPairs.length) {
        wordPairs.splice(index, 1);
        persistAndRender();
      }
    }

    function copyWord(index) {
      const w = wordPairs[index];
      if (!w) return;
      const text = `${w.en} — ${w.fa}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied')).catch(() => showToast('Copy failed'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); showToast('Copied'); } catch (e) { showToast('Copy failed'); }
        document.body.removeChild(ta);
      }
    }

    function speakEnglish(text) {
      if (!window.speechSynthesis) return;
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      sentences.forEach((sentence, i) => {
        setTimeout(() => {
          const utterance = new SpeechSynthesisUtterance(sentence.trim());
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }, i * 500);
      });
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>]/g, m => (m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'));
    }

    // ---------- list rendering ----------
    function renderAll() {
      const active = wordPairs.filter(w => !w.kept);
      const kept = wordPairs.filter(w => w.kept);

      mainList.innerHTML = active.length === 0
        ? `<div class="empty-message">Nothing here yet — type or speak a word below to begin.</div>`
        : active.map(pair => renderItem(pair, wordPairs.indexOf(pair), false)).join('');

      keptList.innerHTML = kept.length === 0
        ? `<div class="empty-message">No kept words yet — tap ✔ on any active word to save it here.</div>`
        : kept.map(pair => renderItem(pair, wordPairs.indexOf(pair), true)).join('');

      attachEvents();
      renderCard();
    }

    function renderItem(pair, globalIdx, isKeptPage) {
      const enEsc = escapeHtml(pair.en);
      const faEsc = escapeHtml(pair.fa);
      const enClass = pair.en.length > 50 ? 'en-word text-sm' : 'en-word';
      const faClass = pair.fa.length > 50 ? 'fa-word text-sm' : 'fa-word';
      const tickBtn = isKeptPage ? '' : `<button class="icon-btn" data-global-index="${globalIdx}" data-action="tick" title="keep">✔</button>`;
      return `
        <div class="word-item" data-index="${globalIdx}">
          <div class="word-main">
            <span class="${enClass}">${enEsc}</span>
            <span class="${faClass}">${faEsc}</span>
          </div>
          <div class="icon-group">
            <button class="icon-btn" data-global-index="${globalIdx}" data-action="copy" title="copy">⧉</button>
            <button class="icon-btn" data-global-index="${globalIdx}" data-action="edit" title="edit">✎</button>
            <button class="icon-btn" data-global-index="${globalIdx}" data-action="voice" title="listen">🔊</button>
            ${tickBtn}
            <button class="icon-btn delete-btn" data-global-index="${globalIdx}" data-action="delete" title="delete">✕</button>
          </div>
        </div>
      `;
    }

    function attachEvents() {
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-global-index'));
          const action = btn.getAttribute('data-action');
          if (isNaN(idx)) return;
          if (action === 'edit') editWord(idx);
          else if (action === 'voice') wordPairs[idx] && speakEnglish(wordPairs[idx].en);
          else if (action === 'tick') toggleKept(idx);
          else if (action === 'delete') deleteWord(idx);
          else if (action === 'copy') copyWord(idx);
        });
      });
    }

    function persistAndRender() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(wordPairs)); } catch (e) {}
      renderAll();
    }

    // ---------- flashcard mode ----------
    const flipCard = document.getElementById('flipCard');
    const flipFront = document.getElementById('flipFront');
    const flipBack = document.getElementById('flipBack');
    const cardProgress = document.getElementById('cardProgress');

    function activeWords() {
      return wordPairs.map((w, i) => ({ ...w, idx: i })).filter(w => !w.kept);
    }

    function renderCard() {
      const list = activeWords();
      if (list.length === 0) {
        cardProgress.textContent = '0 / 0';
        flipFront.textContent = 'No active words';
        flipBack.textContent = 'Add a word first';
        return;
      }
      if (cardIndex >= list.length) cardIndex = 0;
      if (cardIndex < 0) cardIndex = list.length - 1;
      const item = list[cardIndex];
      flipFront.textContent = item.en;
      flipBack.textContent = item.fa;
      cardProgress.textContent = `${cardIndex + 1} / ${list.length}`;
      flipCard.dataset.globalIndex = item.idx;
      flipCard.classList.toggle('flipped', cardFlipped);
    }

    flipCard.addEventListener('click', () => {
      cardFlipped = !cardFlipped;
      flipCard.classList.toggle('flipped', cardFlipped);
    });
    document.getElementById('cardPrev').addEventListener('click', (e) => {
      e.stopPropagation(); cardFlipped = false; cardIndex--; renderCard();
    });
    document.getElementById('cardNext').addEventListener('click', (e) => {
      e.stopPropagation(); cardFlipped = false; cardIndex++; renderCard();
    });
    document.getElementById('cardSpeak').addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(flipCard.dataset.globalIndex);
      if (wordPairs[idx]) speakEnglish(wordPairs[idx].en);
    });
    document.getElementById('cardKeep').addEventListener('click', (e) => {
      e.stopPropagation();
      const idx = parseInt(flipCard.dataset.globalIndex);
      if (!isNaN(idx)) { toggleKept(idx); cardFlipped = false; }
    });

    // ---------- page switching ----------
    pageSwitch.addEventListener('click', (e) => {
      const btn = e.target.closest('.seg-btn');
      if (!btn) return;
      const target = btn.getAttribute('data-page');
      Object.keys(pages).forEach(key => pages[key].classList.toggle('active-page', key === target));
      pageSwitch.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b === btn));
      if (target === 'cardsPage') { cardFlipped = false; renderCard(); }
    });

    // ---------- translate trigger ----------
    translateBtn.addEventListener('click', addFromInput);
    inputEl.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        await addFromInput();
      }
    });

    // ---------- voice input ----------
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let micLangCode = 'en-US';
    let isListening = false;

    if (SpeechRecognitionAPI) {
      recognition = new SpeechRecognitionAPI();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        inputEl.value = transcript;
        inputEl.focus();
      };
      recognition.onerror = () => { showError('Voice input failed. Try again.'); };
      recognition.onend = () => { isListening = false; micBtn.classList.remove('listening'); };

      micBtn.addEventListener('click', () => {
        if (isListening) { recognition.stop(); return; }
        recognition.lang = micLangCode;
        try {
          recognition.start();
          isListening = true;
          micBtn.classList.add('listening');
        } catch (e) {}
      });

      micLang.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-lang]');
        if (!btn) return;
        micLangCode = btn.getAttribute('data-lang');
        micLang.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      });
    } else {
      micBtn.style.display = 'none';
      micLang.style.display = 'none';
    }

    renderAll();
  })();
</script>
</body>
</html>
